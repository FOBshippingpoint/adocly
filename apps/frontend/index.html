<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adocly</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link id="highlight-theme" rel="stylesheet" />
  </head>
  <body>
    <div class="app" id="app">
      <main class="editor-layout" id="editor-layout" data-view-mode="split">
        <section class="pane source-pane">
          <textarea
            id="source-editor"
            class="source-editor"
            aria-label="AsciiDoc source"
            spellcheck="false"
            placeholder="Write AsciiDoc..."
          ></textarea>
          <div id="caret-layer" class="caret-layer" aria-hidden="true"></div>
        </section>
        <div
          id="splitter"
          class="splitter"
          role="separator"
          tabindex="0"
          aria-label="Resize panels"
          aria-orientation="vertical"
          aria-valuemin="15"
          aria-valuemax="85"
          aria-valuenow="50"
          title="Drag to resize · Double-click to reset"
        ></div>
        <section class="pane preview-pane">
          <article id="preview" class="preview"></article>
        </section>
      </main>

      <nav class="toolbar file-toolbar" aria-label="File controls">
        <button id="files-button" type="button" aria-expanded="false" aria-controls="files-menu">
          Files
        </button>
      </nav>
      <div id="files-menu" class="files-menu" aria-label="Files">
        <button id="new-file-button" type="button">New File</button>
        <div id="file-list" class="file-list"></div>
      </div>
      <nav class="toolbar" id="toolbar" aria-label="Document controls">
        <button
          id="collab-button"
          type="button"
          class="collab-button"
          hidden
          aria-label="Collaborators"
          aria-expanded="false"
          title="Collaborators & profile"
        >
          <span id="collab-avatars" class="collab-avatars"></span>
        </button>
        <span id="collab-divider" class="toolbar-divider" aria-hidden="true" hidden></span>
        <button id="history-button" type="button">History</button>
        <button
          id="share-button"
          type="button"
          class="icon-button"
          aria-label="Share document"
          aria-expanded="false"
          aria-controls="share-menu"
          title="Share document"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="18" cy="5" r="3" />
            <circle cx="6" cy="12" r="3" />
            <circle cx="18" cy="19" r="3" />
            <line x1="8.59" x2="15.42" y1="13.51" y2="17.49" />
            <line x1="15.41" x2="8.59" y1="6.51" y2="10.49" />
          </svg>
        </button>
        <button
          id="theme-button"
          type="button"
          class="icon-button"
          aria-label="Toggle theme"
          title="Toggle theme"
          aria-pressed="false"
        >
          <svg
            class="icon-off"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M2 12h2M20 12h2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
            />
          </svg>
          <svg
            class="icon-on"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
          </svg>
        </button>
      </nav>
      <div id="collab-menu" class="collab-menu" aria-label="Collaborators">
        <div
          id="collab-emoji-picker"
          class="collab-emoji-picker"
          role="group"
          aria-label="Choose emoji"
        ></div>
        <div id="collab-list" class="collab-list" role="list"></div>
      </div>
      <div id="history-menu" class="history-menu" aria-label="Document history"></div>
      <div id="share-menu" class="share-menu" aria-label="Share document">
        <button id="share-action-button" type="button" class="share-action-button">
          Share document
        </button>
        <div id="share-link-row" class="share-link-row" hidden>
          <input
            id="share-url-input"
            class="share-url-input"
            type="text"
            readonly
            aria-label="Document link"
          />
          <button
            id="share-copy-button"
            type="button"
            class="share-copy-button"
            aria-label="Copy link"
            title="Copy link"
          >
            <svg
              class="copy-icon lucide lucide-copy preview-icon"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect width="14" height="14" x="8" y="8" rx="2" />
              <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10" />
            </svg>
            <svg
              class="copied-icon lucide lucide-check preview-icon"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M20 6 9 17l-5-5" />
            </svg>
          </button>
        </div>
      </div>
      <div id="cursor-layer" class="cursor-layer" aria-hidden="true"></div>
      <nav class="toolbar view-toolbar" aria-label="Editor view">
        <div
          class="view-switch"
          id="view-switch"
          data-mode="split"
          role="group"
          aria-label="Editor layout"
        >
          <button class="view-button" type="button" data-view="write" aria-pressed="false">
            Write
          </button>
          <button class="view-button active" type="button" data-view="split" aria-pressed="true">
            Split
          </button>
          <button class="view-button" type="button" data-view="preview" aria-pressed="false">
            Preview
          </button>
        </div>
      </nav>
    </div>

    <template id="collab-emoji-button-template">
      <button type="button"></button>
    </template>

    <template id="collab-avatar-template">
      <span class="collab-avatar"></span>
    </template>

    <template id="collab-item-template">
      <div class="collab-item" role="listitem">
        <span class="collab-item-main">
          <span class="collab-avatar"></span>
          <span class="collab-item-name"></span>
        </span>
        <span class="collab-item-status"></span>
      </div>
    </template>

    <template id="collab-selection-template">
      <div class="collab-selection"></div>
    </template>

    <template id="collab-caret-template">
      <div class="collab-caret">
        <span class="collab-caret-nub"></span>
        <span class="collab-caret-flag"></span>
      </div>
    </template>

    <template id="collab-cursor-template">
      <div class="collab-cursor">
        <svg class="collab-cursor-arrow" viewBox="0 0 18 22" fill="none" aria-hidden="true">
          <path
            d="M2.2 1.8L15.8 11.2L9.3 12.4L6.1 18.6L2.2 1.8Z"
            fill="var(--collab-color)"
            stroke="#ffffff"
            stroke-width="1.5"
            stroke-linejoin="round"
          />
        </svg>
        <span class="collab-cursor-emoji"></span>
      </div>
    </template>

    <template id="file-row-template">
      <div class="file-row">
        <button type="button" class="open-file-button"></button>
        <button type="button" class="remove-file-button" title="Remove file">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-trash preview-icon"
          >
            <path d="M10 11v6" />
            <path d="M14 11v6" />
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
            <path d="M3 6h18" />
            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
          </svg>
        </button>
      </div>
    </template>

    <template id="history-item-template">
      <div class="history-item">
        <span class="time"></span>
      </div>
    </template>

    <template id="history-empty-template">
      <div class="history-empty">No history yet</div>
    </template>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
