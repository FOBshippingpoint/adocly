    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        --bg: #fff;
        --fg: #111;
        --muted: #666;
        --border: #ddd;
        --panel-bg: #f9f9f9;
        background: var(--bg);
        color: var(--fg);
      }
      body[data-theme="dark"] {
        --bg: #161616;
        --fg: #e0e0e0;
        --muted: #888;
        --border: #2e2e2e;
        --panel-bg: #1f1f1f;
      }
      button,
      textarea {
        font: inherit;
      }
      .app,
      .editor-layout,
      .pane {
        width: 100%;
        height: 100%;
      }
      .app {
        background: var(--bg);
        color: var(--fg);
      }
      .editor-layout {
        --split: 50%;
        display: grid;
        grid-template-columns: var(--split) minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr);
        position: relative;
      }
      .pane {
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }
      .source-editor {
        width: 100%;
        height: 100%;
        border: 0;
        outline: 0;
        resize: none;
        padding: 2rem;
        background: var(--bg);
        color: var(--fg);
        font:
          14px/1.6 ui-monospace,
          SFMono-Regular,
          Menlo,
          Monaco,
          Consolas,
          monospace;
      }
      .preview {
        height: 100%;
        overflow-y: auto;
        padding: 2rem 2.5rem;
        background: var(--bg);
        color: rgba(0, 0, 0, 0.8);
        font:
          1rem/1 "Noto Serif",
          "DejaVu Serif",
          serif;
      }
      body[data-theme="dark"] .preview {
        color: rgba(255, 255, 255, 0.82);
      }
      body[data-theme="dark"] .preview h1,
      body[data-theme="dark"] .preview h2,
      body[data-theme="dark"] .preview h3,
      body[data-theme="dark"] .preview h4,
      body[data-theme="dark"] .preview h5,
      body[data-theme="dark"] .preview h6,
      body[data-theme="dark"] .preview #toctitle,
      body[data-theme="dark"] .preview .subheader,
      body[data-theme="dark"] .preview .sidebarblock > .content > .title {
        color: #e67c6b;
      }
      body[data-theme="dark"] .preview a {
        color: #6ab0f3;
      }
      body[data-theme="dark"] .preview pre,
      body[data-theme="dark"] .preview code,
      body[data-theme="dark"] .preview :not(pre):not([class^="L"]) > code {
        background: #222 !important;
        color: #e0e0e0 !important;
      }
      body[data-theme="dark"] .preview table,
      body[data-theme="dark"] .preview th,
      body[data-theme="dark"] .preview td {
        background: transparent !important;
        border-color: #333 !important;
        color: rgba(255, 255, 255, 0.82) !important;
      }
      body[data-theme="dark"] .preview #content #toc,
      body[data-theme="dark"] .preview .sidebarblock,
      body[data-theme="dark"] .preview .exampleblock > .content {
        background: #1e1e1e !important;
        border-color: #333 !important;
        box-shadow: none !important;
      }
      .splitter {
        position: absolute;
        top: 0;
        left: var(--split);
        width: 12px;
        height: 100%;
        transform: translateX(-50%);
        z-index: 10;
        cursor: col-resize;
        touch-action: none;
        outline: 0;
      }
      .splitter::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 50%;
        width: 1px;
        background: var(--border);
      }
      .splitter:hover::after,
      .splitter:focus-visible::after,
      .resizing .splitter::after {
        width: 2px;
        background: #438bff;
      }
      .resizing {
        user-select: none;
      }
      .resizing .pane {
        pointer-events: none;
      }
      .toolbar {
        position: fixed;
        top: 0;
        right: 16px;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 4px;
        background: var(--panel-bg);
        border: 1px solid var(--border);
        border-top: 0;
        padding: 8px 10px 6px;
        border-radius: 0 0 14px 14px;
        font: 12px sans-serif;
      }
      .toolbar::before,
      .toolbar::after {
        content: "";
        position: absolute;
        top: 0;
        width: 12px;
        height: 12px;
        pointer-events: none;
      }
      .toolbar::before {
        left: -12px;
        background: radial-gradient(
          circle at 0 100%,
          transparent 11px,
          var(--border) 11px 12px,
          var(--panel-bg) 12px
        );
      }
      .toolbar::after {
        right: -12px;
        background: radial-gradient(
          circle at 100% 100%,
          transparent 11px,
          var(--border) 11px 12px,
          var(--panel-bg) 12px
        );
      }
      .toolbar button {
        position: relative;
        height: 28px;
        padding: 0 7px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--fg);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        font: 12px sans-serif;
      }
      .toolbar button:hover,
      .toolbar button[aria-pressed="true"] {
        background: var(--border);
      }

      .view-switch {
        position: relative;
        display: flex;
        width: 174px;
      }

      .view-switch::before {
        content: "";
        position: absolute;
        z-index: 0;
        inset: 0 auto 0 0;
        width: calc(100% / 3);
        border-radius: 6px;
        background: var(--border);
        transform: translateX(0);
        transition: transform 180ms ease;
      }

      .view-switch[data-mode="split"]::before {
        transform: translateX(100%);
      }
      .view-switch[data-mode="preview"]::before {
        transform: translateX(200%);
      }
      .view-switch .view-button {
        z-index: 1;
        flex: 1;
        justify-content: center;
        background: transparent !important;
      }
      .icon-button {
        width: 28px;
        justify-content: center;
        padding: 3px !important;
      }
      .icon-button svg {
        width: 16px;
        height: 16px;
      }
      .icon-button .icon-on,
      .icon-button.active .icon-off {
        display: none;
      }
      .icon-button.active .icon-on {
        display: block;
      }
      .history-menu {
        position: fixed;
        top: 48px;
        right: 16px;
        width: 220px;
        max-height: 60vh;
        overflow-y: auto;
        z-index: 30;
        display: none;
        flex-direction: column;
        gap: 4px;
        padding: 10px;
        background: var(--panel-bg);
        border: 1px solid var(--border);
        border-radius: 14px;
        color: var(--fg);
        font: 12px sans-serif;
      }
      .history-menu.open {
        display: flex;
      }
      .history-item {
        display: flex;
        justify-content: space-between;
        padding: 3px 7px;
        border-radius: 6px;
        cursor: pointer;
      }
      .history-item:hover,
      .history-item.current {
        background: var(--border);
      }
      .history-item .sub {
        color: var(--muted);
        font-size: 11px;
      }
      .view-toolbar {
        top: auto;
        right: 50%;
        bottom: 0;
        transform: translateX(50%);
        display: flex;
        border-top: 1px solid var(--border);
        border-bottom: 0;
        border-radius: 14px 14px 0 0;
        padding: 6px 10px 8px;
      }
      .view-toolbar::before,
      .view-toolbar::after {
        top: auto;
        bottom: 0;
      }
      .view-toolbar::before {
        background: radial-gradient(
          circle at 0 0,
          transparent 11px,
          var(--border) 11px 12px,
          var(--panel-bg) 12px
        );
      }
      .view-toolbar::after {
        background: radial-gradient(
          circle at 100% 0,
          transparent 11px,
          var(--border) 11px 12px,
          var(--panel-bg) 12px
        );
      }
      @media (max-width: 700px) {
        .editor-layout {
          grid-template-columns: 1fr;
          grid-template-rows: var(--split) minmax(0, 1fr);
        }
        .splitter {
          top: var(--split);
          left: 0;
          width: 100%;
          height: 12px;
          transform: translateY(-50%);
          cursor: row-resize;
        }
        .splitter::after {
          inset: 50% 0 auto;
          width: 100%;
          height: 1px;
        }
        .editor-layout[data-view-mode="write"],
        .editor-layout[data-view-mode="preview"] {
          grid-template-rows: 1fr;
        }
        .editor-layout[data-view-mode="write"] .preview-pane,
        .editor-layout[data-view-mode="preview"] .source-pane,
        .editor-layout[data-view-mode="write"] .splitter,
        .editor-layout[data-view-mode="preview"] .splitter {
          display: none;
        }
      }

      .editor-layout[data-view-mode="write"],
      .editor-layout[data-view-mode="preview"] {
        grid-template-columns: 1fr;
      }
      .editor-layout[data-view-mode="write"] .preview-pane,
      .editor-layout[data-view-mode="preview"] .source-pane,
      .editor-layout[data-view-mode="write"] .splitter,
      .editor-layout[data-view-mode="preview"] .splitter {
        display: none;
      }

      @media (min-width: 701px) {
        .editor-layout[data-view-mode="preview"] .preview {
          padding-inline: clamp(2.5rem, 10vw, 10rem);
        }

        .editor-layout[data-view-mode="preview"] .preview > * {
          width: 100%;
          max-width: 900px;
          margin-inline: auto;
        }
      }

      @media (max-width: 700px) {
        .view-switch .view-button[data-view="split"] {
          display: none;
        }
        .view-switch {
          width: 116px;
        }
        .view-switch::before {
          width: 50%;
        }
        .view-switch[data-mode="preview"]::before {
          transform: translateX(100%);
        }
      }
    </style>
  </head>
  <body>
    <div class="app" id="app">
      <main class="editor-layout" id="editor-layout" data-view-mode="split">
        <section class="pane source-pane">
          <textarea
            id="source-editor"
            class="source-editor"
            aria-label="AsciiDoc source"
            spellcheck="false"
            placeholder="Write AsciiDoc..."
          ></textarea>
        </section>
        <div
          id="splitter"
          class="splitter"
          role="separator"
          tabindex="0"
          aria-label="Resize panels"
          aria-orientation="vertical"
          aria-valuemin="15"
          aria-valuemax="85"
          aria-valuenow="50"
          title="Drag to resize · Double-click to reset"
        ></div>
        <section class="pane preview-pane">
          <article id="preview" class="preview"></article>
        </section>
      </main>

      <nav class="toolbar" id="toolbar" aria-label="Document controls">
        <button id="history-button" type="button">History</button>
        <button
          id="share-button"
          type="button"
          class="icon-button"
          aria-label="Copy #hash link"
          title="Copy #hash link"
        >
          <svg
            class="icon-off"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="18" cy="5" r="3" />
            <circle cx="6" cy="12" r="3" />
            <circle cx="18" cy="19" r="3" />
            <line x1="8.59" x2="15.42" y1="13.51" y2="17.49" />
            <line x1="15.41" x2="8.59" y1="6.51" y2="10.49" />
          </svg>
          <svg
            class="icon-on"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M20 6 9 17l-5-5" />
          </svg>
        </button>
        <button
          id="theme-button"
          type="button"
          class="icon-button"
          aria-label="Toggle theme"
          title="Toggle theme"
          aria-pressed="false"
        >
          <svg
            class="icon-off"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M2 12h2M20 12h2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
            />
          </svg>
          <svg
            class="icon-on"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
          </svg>
        </button>
      </nav>
      <div id="history-menu" class="history-menu" aria-label="Document history"></div>
      <nav class="toolbar view-toolbar" aria-label="Editor view">
        <div
          class="view-switch"
          id="view-switch"
          data-mode="split"
          role="group"
          aria-label="Editor layout"
        >
          <button class="view-button" type="button" data-view="write" aria-pressed="false">
            Write
          </button>
          <button class="view-button active" type="button" data-view="split" aria-pressed="true">
            Split
          </button>
          <button class="view-button" type="button" data-view="preview" aria-pressed="false">
            Preview
          </button>
        </div>
      </nav>
    </div>

    <script>
      const $ = document.querySelector.bind(document);
      const $$ = (selector) => [...document.querySelectorAll(selector)];

      EventTarget.prototype.on = Element.prototype.addEventListener;
      EventTarget.prototype.off = EventTarget.prototype.removeEventListener;

      Element.prototype.$ = Element.prototype.querySelector;
      Element.prototype.$$ = function (selector) {
        return [...this.querySelectorAll(selector)];
      };

      DocumentFragment.prototype.$ = DocumentFragment.prototype.querySelector;
      DocumentFragment.prototype.$$ = function (selector) {
        return [...this.querySelectorAll(selector)];
      };

      class Database {
        constructor(name = "AdoclyDB") {
          this.name = name;
          this.version = 3;
          this.connection = null;
        }

        async open() {
          if (this.connection) return this.connection;
          return new Promise((resolve, reject) => {
            const request = indexedDB.open(this.name, this.version);
            request.onupgradeneeded = ({ target }) => {
              const db = target.result;
              if (!db.objectStoreNames.contains("history")) {
                const history = db.createObjectStore("history", {
                  keyPath: "id",
                  autoIncrement: true,
                });
                history.createIndex("timestamp", "timestamp", { unique: false });
              }
              if (!db.objectStoreNames.contains("settings"))
                db.createObjectStore("settings", { keyPath: "key" });
              if (!db.objectStoreNames.contains("images"))
                db.createObjectStore("images", { keyPath: "name" });
            };
            request.onsuccess = ({ target }) => {
              this.connection = target.result;
              resolve(this.connection);
            };
            request.onerror = () => reject(request.error);
          });
        }

        async getSetting(key, fallback = null) {
          await this.open();
          return new Promise((resolve) => {
            const request = this.connection
              .transaction("settings", "readonly")
              .objectStore("settings")
              .get(key);
            request.onsuccess = () => resolve(request.result ? request.result.value : fallback);
            request.onerror = () => resolve(fallback);
          });
        }

        async setSetting(key, value) {
          await this.open();
          return new Promise((resolve, reject) => {
            const transaction = this.connection.transaction("settings", "readwrite");
            transaction.objectStore("settings").put({ key, value });
            transaction.oncomplete = resolve;
            transaction.onerror = () => reject(transaction.error);
          });
        }

        async saveImage(name, blob) {
          await this.open();
          return new Promise((resolve, reject) => {
            const transaction = this.connection.transaction("images", "readwrite");
            transaction.objectStore("images").put({ name, blob, timestamp: Date.now() });
            transaction.oncomplete = () => resolve(name);
            transaction.onerror = () => reject(transaction.error);
          });
        }

        async getImage(name) {
          await this.open();
          return new Promise((resolve) => {
            const request = this.connection
              .transaction("images", "readonly")
              .objectStore("images")
              .get(name);
            request.onsuccess = () => resolve(request.result?.blob || null);
            request.onerror = () => resolve(null);
          });
        }

        async getHistory() {
          await this.open();
          return new Promise((resolve, reject) => {
            const request = this.connection
              .transaction("history", "readonly")
              .objectStore("history")
              .getAll();
            request.onsuccess = () =>
              resolve((request.result || []).sort((a, b) => b.timestamp - a.timestamp));
            request.onerror = () => reject(request.error);
          });
        }

        async addSnapshot(content) {
          await this.open();
          if (!content.trim()) return null;
          const history = await this.getHistory();
          if (history[0]?.content === content) return history[0];
          const snapshot = { content, timestamp: Date.now() };
          return new Promise((resolve, reject) => {
            const transaction = this.connection.transaction("history", "readwrite");
            const request = transaction.objectStore("history").add(snapshot);
            request.onsuccess = () => {
              snapshot.id = request.result;
              resolve(snapshot);
            };
            request.onerror = () => reject(request.error);
          });
        }
      }

      class HashShare {
        static maxLength = 2000;
        static encodeBytes(bytes) {
          let binary = "";
          for (const byte of bytes) binary += String.fromCharCode(byte);
          return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
        }
        static decodeBytes(value) {
          let base64 = value.replace(/-/g, "+").replace(/_/g, "/");
          while (base64.length % 4) base64 += "=";
          return Uint8Array.from(atob(base64), (character) => character.charCodeAt(0));
        }
        static async encode(text) {
          const stream = new CompressionStream("deflate-raw");
          const writer = stream.writable.getWriter();
          writer.write(new TextEncoder().encode(text));
          writer.close();
          const bytes = new Uint8Array(await new Response(stream.readable).arrayBuffer());
          const payload = `z=${this.encodeBytes(bytes)}`;
          return { hash: `#${payload}`, canShare: payload.length <= this.maxLength };
        }
        static async decode(hash) {
          if (!hash.startsWith("#z=")) return null;
          const stream = new DecompressionStream("deflate-raw");
          const writer = stream.writable.getWriter();
          writer.write(this.decodeBytes(hash.slice(3)));
          writer.close();
          return new TextDecoder().decode(await new Response(stream.readable).arrayBuffer());
        }
      }

      const DEFAULT_CONTENT = `= AsciiDoc Document
:toc:

== Section

Write AsciiDoc on the left. Rendered with the default Asciidoctor stylesheet on the right.

NOTE: Small documents automatically sync to the URL \`#\` hash for sharing.

[source,js]
----
console.log("Plain browser JavaScript");
----
`;

      const database = new Database();
      const imageCache = new Map();
      const state = {
        split: 50,
        viewMode: "split",
        desktopViewMode: "split",
        theme: "light",
        saveTimer: null,
        snapshotTimer: null,
        lastSnapshot: 0,
        shareTimer: null,
      };
      const source = $("#source-editor");
      const preview = $("#preview");
      const layout = $("#editor-layout");
      const splitter = $("#splitter");
      const viewButtons = $$("[data-view]");
      const viewSwitch = $("#view-switch");

      function setSplit(value) {
        state.split = Math.max(15, Math.min(Number(value) || 50, 85));
        layout.style.setProperty("--split", `${state.split}%`);
        splitter.setAttribute("aria-valuenow", Math.round(state.split));
      }

      function setViewMode(mode) {
        state.viewMode = mode;
        if (!matchMedia("(max-width: 700px)").matches) state.desktopViewMode = mode;
        layout.dataset.viewMode = mode;
        viewSwitch.dataset.mode = mode;
        viewButtons.forEach((button) => {
          const active = button.dataset.view === mode;
          button.classList.toggle("active", active);
          button.setAttribute("aria-pressed", active);
        });
      }

      function setTheme(theme) {
        state.theme = theme;
        document.body.dataset.theme = theme;
        $("#theme-button").classList.toggle("active", theme === "dark");
        $("#theme-button").setAttribute("aria-pressed", theme === "dark");
        $("#highlight-theme").href =
          theme === "dark"
            ? "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
            : "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css";
      }

      function blobToDataUrl(blob) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
      }

      async function renderPreview(text) {
        preview.innerHTML = Asciidoctor().convert(text, {
          safe: "safe",
          attributes: { showtitle: true, "source-highlighter": "highlight.js" },
        });
        if (typeof hljs !== "undefined")
          preview.$$("pre code").forEach((code) => hljs.highlightElement(code));
        for (const image of preview.$$("img")) {
          const name = image.getAttribute("src");
          if (!name || /^(https?:|data:|blob:|\/)/i.test(name)) continue;
          const blob = await database.getImage(name);
          if (!blob) continue;
          const dataUrl = typeof blob === "string" ? blob : await blobToDataUrl(blob);
          imageCache.set(name, dataUrl);
          image.src = dataUrl;
        }
      }

      function expandImageReferences(text) {
        return text.replace(
          /(image::?)(img-[a-z0-9]+\.[a-z0-9]+)(\[[^\]]*\])/gi,
          (match, prefix, name, attributes) => {
            const dataUrl = imageCache.get(name);
            return dataUrl ? `${prefix}${dataUrl}${attributes}` : match;
          },
        );
      }

      async function syncDocument(text) {
        await renderPreview(text);
        const encoded = await HashShare.encode(text);
        $("#share-button").hidden = !encoded.canShare;
        if (encoded.canShare) {
          try {
            history.replaceState(null, "", encoded.hash);
          } catch (_) {}
        } else if (location.hash) {
          try {
            history.replaceState(null, "", location.pathname + location.search);
          } catch (_) {}
        }
      }

      async function recordSnapshot(text) {
        const snapshot = await database.addSnapshot(text);
        state.lastSnapshot = Date.now();
        renderHistory(await database.getHistory(), snapshot?.id);
      }

      function renderHistory(items, activeId = null) {
        const menu = $("#history-menu");
        menu.innerHTML = items
          .map(
            (item) =>
              `<div class="history-item ${item.id === activeId ? "current" : ""}" data-id="${item.id}"><span>${new Date(item.timestamp).toLocaleTimeString()}</span><span class="sub">${item.content.length}c</span></div>`,
          )
          .join("");
        menu.$$("[data-id]").forEach((item) =>
          item.on("click", async () => {
            const snapshot = items.find((entry) => entry.id === Number(item.dataset.id));
            source.value = snapshot.content;
            await database.setSetting("content", snapshot.content);
            await syncDocument(snapshot.content);
            menu.classList.remove("open");
            $("#history-button").classList.remove("active");
          }),
        );
      }

      function insertTextAtCursor(text) {
        const start = source.selectionStart;
        const prefix = start > 0 && source.value[start - 1] !== "\n" ? "\n" : "";
        source.setRangeText(`${prefix}${text}`, start, source.selectionEnd, "end");
        source.dispatchEvent(new Event("input", { bubbles: true }));
      }

      async function addImages(files) {
        for (const file of files) {
          const extension = (file.type.split("/")[1] || "png").replace(/[^a-z0-9]/gi, "");
          const name = `img-${Date.now().toString(36)}.${extension}`;
          imageCache.set(name, await blobToDataUrl(file));
          await database.saveImage(name, file);
          insertTextAtCursor(`image::${name}[]\n`);
        }
      }

      function bindSource() {
        source.on("input", () => {
          const text = source.value;
          syncDocument(text);
          clearTimeout(state.saveTimer);
          state.saveTimer = setTimeout(() => database.setSetting("content", text), 200);
          if (Date.now() - state.lastSnapshot > 15000) recordSnapshot(text);
          else {
            clearTimeout(state.snapshotTimer);
            state.snapshotTimer = setTimeout(() => recordSnapshot(text), 1500);
          }
        });
        source.on("copy", (event) => {
          const selected = source.value.slice(source.selectionStart, source.selectionEnd);
          if (!selected || !/image::?img-/i.test(selected)) return;
          event.preventDefault();
          event.clipboardData.setData("text/plain", expandImageReferences(selected));
        });
        source.on("cut", (event) => {
          const selected = source.value.slice(source.selectionStart, source.selectionEnd);
          if (!selected || !/image::?img-/i.test(selected)) return;
          event.preventDefault();
          event.clipboardData.setData("text/plain", expandImageReferences(selected));
          source.setRangeText("", source.selectionStart, source.selectionEnd, "end");
          source.dispatchEvent(new Event("input", { bubbles: true }));
        });
        source.on("paste", (event) => {
          const files = [...(event.clipboardData?.items || [])]
            .filter((item) => item.type.startsWith("image/"))
            .map((item) => item.getAsFile())
            .filter(Boolean);
          if (files.length) {
            event.preventDefault();
            addImages(files);
          }
        });
        source.on("dragover", (event) => {
          if (event.dataTransfer?.types.includes("Files")) event.preventDefault();
        });
        source.on("drop", (event) => {
          const files = [...(event.dataTransfer?.files || [])].filter((file) =>
            file.type.startsWith("image/"),
          );
          if (files.length) {
            event.preventDefault();
            addImages(files);
          }
        });
      }

      function bindSplitter() {
        const mobile = matchMedia("(max-width: 700px)");
        let pointerId = null;
        const updateOrientation = () =>
          splitter.setAttribute("aria-orientation", mobile.matches ? "horizontal" : "vertical");
        updateOrientation();
        mobile.on("change", (event) => {
          updateOrientation();
          setViewMode(event.matches ? "write" : state.desktopViewMode);
        });
        splitter.on("pointerdown", (event) => {
          if (event.button !== 0) return;
          event.preventDefault();
          pointerId = event.pointerId;
          splitter.setPointerCapture(pointerId);
          splitter.focus();
          layout.classList.add("resizing");
        });
        splitter.on("pointermove", (event) => {
          if (event.pointerId !== pointerId) return;
          const bounds = layout.getBoundingClientRect();
          setSplit(
            ((mobile.matches ? event.clientY - bounds.top : event.clientX - bounds.left) /
              (mobile.matches ? bounds.height : bounds.width)) *
              100,
          );
        });
        const stop = (event) => {
          if (event.pointerId !== pointerId) return;
          if (splitter.hasPointerCapture(pointerId)) splitter.releasePointerCapture(pointerId);
          pointerId = null;
          layout.classList.remove("resizing");
        };
        splitter.on("pointerup", stop);
        splitter.on("pointercancel", stop);
        splitter.on("lostpointercapture", stop);
        splitter.on("dblclick", () => setSplit(50));
        splitter.on("keydown", (event) => {
          const down = mobile.matches ? "ArrowUp" : "ArrowLeft";
          const up = mobile.matches ? "ArrowDown" : "ArrowRight";
          if (![down, up, "Home", "End", "Enter"].includes(event.key)) return;
          event.preventDefault();
          if (event.key === "Home") setSplit(15);
          else if (event.key === "End") setSplit(85);
          else if (event.key === "Enter") setSplit(50);
          else setSplit(state.split + (event.key === down ? -1 : 1) * (event.shiftKey ? 10 : 2));
        });
      }

      function bindToolbar() {
        const historyButton = $("#history-button");
        const menu = $("#history-menu");
        historyButton.on("click", async () => {
          const open = menu.classList.toggle("open");
          historyButton.classList.toggle("active", open);
          if (open) renderHistory(await database.getHistory());
        });
        $("#share-button").on("click", async () => {
          const encoded = await HashShare.encode(source.value);
          if (!encoded.canShare) return;
          const url = location.href.split("#")[0] + encoded.hash;
          await navigator.clipboard.writeText(url);
          const button = $("#share-button");
          button.classList.add("active");
          clearTimeout(state.shareTimer);
          state.shareTimer = setTimeout(() => button.classList.remove("active"), 1200);
        });
        $("#theme-button").on("click", async () => {
          const theme = state.theme === "dark" ? "light" : "dark";
          setTheme(theme);
          await database.setSetting("theme", theme);
        });
        viewButtons.forEach((button) =>
          button.on("click", () => {
            setViewMode(button.dataset.view);
          }),
        );
        document.on("pointerdown", (event) => {
          if (
            menu.classList.contains("open") &&
            !event.composedPath().includes(menu) &&
            !event.composedPath().includes(historyButton)
          ) {
            menu.classList.remove("open");
            historyButton.classList.remove("active");
          }
        });
        $("#preview").on("copy", (event) => {
          const selection = getSelection();
          if (!selection || selection.isCollapsed) return;
          const container = document.createElement("div");
          for (let i = 0; i < selection.rangeCount; i++)
            container.appendChild(selection.getRangeAt(i).cloneContents());
          event.preventDefault();
          event.clipboardData.setData("text/html", container.innerHTML);
          event.clipboardData.setData("text/plain", selection.toString());
        });
      }

      async function loadFromHash() {
        if (!location.hash.startsWith("#z=")) return false;
        try {
          const text = await HashShare.decode(location.hash);
          if (!text) return false;
          source.value = text;
          await database.setSetting("content", text);
          await recordSnapshot(text);
          await syncDocument(text);
          return true;
        } catch (_) {
          return false;
        }
      }

      async function init() {
        setSplit(50);
        setViewMode(matchMedia("(max-width: 700px)").matches ? "write" : "split");
        bindSource();
        bindSplitter();
        bindToolbar();
        const savedTheme = await database.getSetting("theme");
        setTheme(
          savedTheme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"),
        );
        if (!(await loadFromHash())) {
          source.value = await database.getSetting("content", DEFAULT_CONTENT);
          await recordSnapshot(source.value);
          await syncDocument(source.value);
        }
        window.on("hashchange", loadFromHash);
      }

      init();
    </script>
  </body>
</html>
