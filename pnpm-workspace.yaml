packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@aws-sdk/client-s3": ^3.1156.0
  "@aws-sdk/s3-request-presigner": ^3.1156.0
  "@types/node": ^24
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  cbor-extract: true
  esbuild: true
  workerd: true
